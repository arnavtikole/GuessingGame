<!DOCTYPE html>
<html>
<head>
    <title>Guessing Game</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

    :root {
        --alien-green: #39ff88;
        --plasma-cyan: #28f3ff;
        --nebula-pink: #ff3cac;
        --void: #05020f;
        --cosmic-purple: #7a2cff;
        --warning-amber: #ffc83d;
    }

    /* ===== DEEP SPACE BACKGROUND ===== */
    html {
        min-height: 100%;
        overflow-x: hidden;
        background:
            radial-gradient(ellipse at 15% 10%, rgba(122, 44, 255, 0.45), transparent 50%),
            radial-gradient(ellipse at 85% 85%, rgba(57, 255, 136, 0.22), transparent 50%),
            radial-gradient(ellipse at 75% 20%, rgba(255, 60, 172, 0.22), transparent 45%),
            radial-gradient(ellipse at 30% 90%, rgba(40, 243, 255, 0.15), transparent 50%),
            linear-gradient(#02010a, #0a0524 60%, #03131a);
        background-attachment: fixed;
    }

    /* Twinkling star layers */
    html::before,
    html::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
    }

    html::before {
        background-image:
            radial-gradient(1px 1px at 20px 30px, #fff, transparent),
            radial-gradient(1.5px 1.5px at 90px 140px, #cfe9ff, transparent),
            radial-gradient(1px 1px at 160px 70px, #fff, transparent),
            radial-gradient(2px 2px at 220px 190px, #fff7c2, transparent),
            radial-gradient(1px 1px at 270px 20px, #fff, transparent),
            radial-gradient(1.5px 1.5px at 40px 230px, #ffd6f5, transparent),
            radial-gradient(1px 1px at 130px 260px, #fff, transparent);
        background-size: 300px 300px;
        animation: twinkle 4s ease-in-out infinite alternate, drift 120s linear infinite;
    }

    html::after {
        background-image:
            radial-gradient(1px 1px at 60px 80px, #fff, transparent),
            radial-gradient(2px 2px at 180px 120px, #aef, transparent),
            radial-gradient(1px 1px at 310px 210px, #fff, transparent),
            radial-gradient(1.5px 1.5px at 400px 40px, #fdf, transparent),
            radial-gradient(1px 1px at 450px 330px, #fff, transparent),
            radial-gradient(2px 2px at 120px 380px, #ffe9a8, transparent);
        background-size: 500px 500px;
        animation: twinkle 6s ease-in-out 1.5s infinite alternate-reverse, drift 200s linear infinite reverse;
    }

    /* ===== THE MISSION CONTROL PANEL (body as a card) ===== */
    body {
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        width: min(620px, calc(100% - 32px));
        margin: 110px auto 80px;
        padding: 44px 32px 36px;
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        font-size: 17px;
        color: #c8ffe6;
        text-align: center;
        background:
            repeating-linear-gradient(0deg, rgba(57, 255, 136, 0.04) 0 2px, transparent 2px 4px),
            linear-gradient(160deg, rgba(14, 8, 45, 0.82), rgba(4, 18, 24, 0.82));
        border: 2px solid var(--alien-green);
        border-radius: 28px;
        box-shadow:
            0 0 18px rgba(57, 255, 136, 0.55),
            0 0 60px rgba(122, 44, 255, 0.35),
            inset 0 0 35px rgba(57, 255, 136, 0.12);
        backdrop-filter: blur(4px);
    }

    /* Hovering UFO above the panel */
    body::before {
        content: "🛸";
        position: absolute;
        top: -78px;
        left: 50%;
        font-size: 68px;
        line-height: 1;
        transform: translateX(-50%);
        filter: drop-shadow(0 0 14px var(--alien-green)) drop-shadow(0 18px 18px rgba(57, 255, 136, 0.35));
        animation: ufoHover 5s ease-in-out infinite;
    }

    /* Ringed planet orbiting the corner */
    body::after {
        content: "🪐";
        position: absolute;
        bottom: -52px;
        right: -34px;
        font-size: 84px;
        line-height: 1;
        filter: drop-shadow(0 0 18px var(--cosmic-purple));
        animation: planetFloat 9s ease-in-out infinite;
        pointer-events: none;
    }

    /* ===== TITLE ===== */
    h2 {
        margin: 0 0 26px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: clamp(22px, 5vw, 32px);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        background: linear-gradient(90deg, var(--alien-green), var(--plasma-cyan), var(--nebula-pink), var(--alien-green));
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter: drop-shadow(0 0 10px rgba(57, 255, 136, 0.65));
        animation: hologram 6s linear infinite;
    }

    h2::before { content: "👽 "; -webkit-text-fill-color: initial; }
    h2::after  { content: " 👾"; -webkit-text-fill-color: initial; }

    /* ===== TEXT / LABELS ===== */
    p, label {
        text-shadow: 0 0 8px rgba(57, 255, 136, 0.55);
    }

    /* "Select Difficulty Level:" */
    p:first-of-type {
        margin: 0 0 12px;
        color: var(--plasma-cyan);
        font-family: 'Orbitron', sans-serif;
        font-size: 14px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-shadow: 0 0 10px var(--plasma-cyan);
    }
    p:first-of-type::before { content: "✦ "; color: var(--nebula-pink); }
    p:first-of-type::after  { content: " ✦"; color: var(--nebula-pink); }

    label {
        display: block;
        margin: 6px 0 12px;
        color: var(--warning-amber);
        font-family: 'Orbitron', sans-serif;
        font-size: 14px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255, 200, 61, 0.7);
    }
    label::before { content: "🛰️ "; }

    /* ===== BUTTONS ===== */
    button,
    input[type="button"] {
        cursor: pointer;
        margin: 5px 4px;
        padding: 11px 22px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #04120a;
        border: 2px solid transparent;
        border-radius: 999px;
        transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    /* Easy / Medium / Hard */
    button:nth-of-type(1) {
        background: linear-gradient(135deg, #39ff88, #1fd6a0);
        box-shadow: 0 0 14px rgba(57, 255, 136, 0.7);
    }
    button:nth-of-type(1)::before { content: "🌍 "; }

    button:nth-of-type(2) {
        background: linear-gradient(135deg, #ffd84d, #ff9d2e);
        box-shadow: 0 0 14px rgba(255, 190, 60, 0.7);
    }
    button:nth-of-type(2)::before { content: "🌕 "; }

    button:nth-of-type(3) {
        background: linear-gradient(135deg, #ff5ec4, #ff2f5f);
        color: #fff;
        box-shadow: 0 0 14px rgba(255, 60, 140, 0.75);
    }
    button:nth-of-type(3)::before { content: "☄️ "; }

    /* Guess button */
    input[type="button"] {
        background: linear-gradient(135deg, var(--cosmic-purple), var(--plasma-cyan));
        color: #fff;
        box-shadow: 0 0 16px rgba(122, 44, 255, 0.8);
    }

    button:hover,
    input[type="button"]:hover {
        transform: translateY(-3px) scale(1.06);
        filter: brightness(1.2);
        box-shadow: 0 0 26px currentColor, 0 0 40px rgba(57, 255, 136, 0.45);
    }

    button:active,
    input[type="button"]:active {
        transform: translateY(1px) scale(0.96);
    }

    button:focus-visible,
    input:focus-visible {
        outline: 2px dashed var(--plasma-cyan);
        outline-offset: 4px;
    }

    /* ===== NUMBER INPUT ===== */
    input[type="text"] {
        box-sizing: border-box;
        width: 58%;
        min-width: 150px;
        padding: 12px 16px;
        font-family: 'Share Tech Mono', monospace;
        font-size: 18px;
        text-align: center;
        color: var(--alien-green);
        background: rgba(0, 8, 14, 0.85);
        border: 2px solid var(--cosmic-purple);
        border-radius: 12px;
        box-shadow: inset 0 0 14px rgba(122, 44, 255, 0.45), 0 0 10px rgba(122, 44, 255, 0.4);
        caret-color: var(--nebula-pink);
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]::placeholder {
        color: rgba(200, 255, 230, 0.4);
        letter-spacing: 0.08em;
    }

    input[type="text"]:focus {
        outline: none;
        border-color: var(--alien-green);
        box-shadow: inset 0 0 14px rgba(57, 255, 136, 0.35), 0 0 22px rgba(57, 255, 136, 0.8);
    }

    /* ===== ALIEN TRANSMISSION (feedback) ===== */
    #feedbackLabel {
        margin: 26px 0 14px;
        padding: 16px 18px;
        min-height: 1.4em;
        text-align: left;
        font-size: 18px;
        color: var(--alien-green);
        background: rgba(0, 10, 8, 0.7);
        border: 1px solid rgba(57, 255, 136, 0.5);
        border-left: 5px solid var(--alien-green);
        border-radius: 10px;
        box-shadow: inset 0 0 18px rgba(57, 255, 136, 0.15), 0 0 12px rgba(57, 255, 136, 0.25);
    }
    #feedbackLabel::before { content: "👽 > "; color: var(--nebula-pink); }
    #feedbackLabel::after {
        content: "█";
        margin-left: 4px;
        color: var(--alien-green);
        animation: blink 1s steps(1) infinite;
    }
    #feedbackLabel:empty::before { content: "📡 Awaiting transmission from deep space..."; color: rgba(200, 255, 230, 0.55); }

    /* ===== FUEL CELLS (guesses left) ===== */
    #guessesLeftLabel {
        margin: 0;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--warning-amber);
        text-shadow: 0 0 12px rgba(255, 200, 61, 0.8);
        animation: pulse 2.2s ease-in-out infinite;
    }
    #guessesLeftLabel:not(:empty)::before { content: "🔋 "; }
    #guessesLeftLabel:empty::before {
        content: "⚡ Fuel cells: standby ⚡";
        color: rgba(255, 200, 61, 0.6);
    }

    /* Audio stays hidden */
    audio { display: none; }

    ::selection { background: var(--nebula-pink); color: #fff; }

    /* ===== ANIMATIONS ===== */
    @keyframes twinkle {
        0%   { opacity: 0.35; }
        50%  { opacity: 1; }
        100% { opacity: 0.55; }
    }
    @keyframes drift {
        from { background-position: 0 0; }
        to   { background-position: 600px 900px; }
    }
    @keyframes ufoHover {
        0%, 100% { transform: translateX(-50%) translateY(0) rotate(-5deg); }
        25%      { transform: translateX(-38%) translateY(-10px) rotate(3deg); }
        50%      { transform: translateX(-50%) translateY(-18px) rotate(5deg); }
        75%      { transform: translateX(-62%) translateY(-8px) rotate(-3deg); }
    }
    @keyframes planetFloat {
        0%, 100% { transform: translate(0, 0) rotate(-12deg); }
        50%      { transform: translate(-8px, -14px) rotate(8deg); }
    }
    @keyframes hologram {
        to { background-position: 250% 0; }
    }
    @keyframes blink {
        50% { opacity: 0; }
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
        html::before, html::after, body::before, body::after,
        h2, #feedbackLabel::after, #guessesLeftLabel { animation: none; }
    }

    @media (max-width: 480px) {
        body { padding: 40px 18px 30px; }
        input[type="text"] { width: 100%; margin-bottom: 8px; }
    }
</style>
</head>
<body>

    <h2>Guessing Game</h2>

    <!-- Difficulty Level Selection -->
    <p>Select Difficulty Level:</p>
    <button onclick="setRandom(1)">Easy</button>
    <button onclick="setRandom(2)">Medium</button>
    <button onclick="setRandom(3)">Hard</button>

    <br><br>

    
    <label for="guess1">Guess the Number:</label>
    <input type="text" name="guess" id="guess1" placeholder="Enter a Number">
    <input type="button" value="Guess" onclick="playerGuess()">

    
    <p id="feedbackLabel"></p>
    <p id="guessesLeftLabel"></p>
    <audio id="winSound" src="C:\Users\5\Downloads\mrstokes302-success-videogame-sfx-mrstokes302-423626.mp3"></audio>
    <audio id="loseSound" src="C:\Users\5\Downloads\u_l5xum8z250-losing-horn-313723.mp3"></audio>
    <script>
        
        var secret = "";
        var guessesRemaining = 0;

        // To set difficulty and level
        function setRandom(level) {
            secret = ""; 

            // Set maximum tries based on level chosen by player
            if (level === 1) {
                guessesRemaining = 3;
            } else if (level === 2) {
                guessesRemaining = 5;
            } else if (level === 3) {
                guessesRemaining = 8;
            }

            // Update display
            document.getElementById("guessesLeftLabel").innerText = "Guesses Left: " + guessesRemaining;
            document.getElementById("feedbackLabel").innerText = "New game started! Make your guess.";

            // First digit, has to be nonzero
            if (level > 0) {
                secret = secret + (Math.floor(Math.random() * 9) + 1);
                level--;
            }

            // Remaining digits, could be 0
            while (level > 0) {
                secret = secret + Math.floor(Math.random() * 10);
                level--;
            }
        }

        // Handles user guesses
        function playerGuess() {
            // End game
            if (guessesRemaining <= 0) {
                document.getElementById("guessesLeftLabel").innerText = "Guesses Left: 0";
                document.getElementById("feedbackLabel").innerText = "Game over, press one of the difficulty levels to play again.";
                return;
            }

            
            var userGuess = document.getElementById("guess1").value;

            // when they don't input an appropriate value
            if (isNaN(userGuess) || userGuess === "") {
                document.getElementById("feedbackLabel").innerText = "That is not a number. Please try again.";
                return;
            }

            // Remaining attempts
            guessesRemaining--;
            if (guessesRemaining < 0) {
                guessesRemaining = 0;
            }
            document.getElementById("guessesLeftLabel").innerText = "Guesses Left: " + guessesRemaining;

            // User guess feedback
            if (userGuess == secret) {
                document.getElementById("feedbackLabel").innerText = "You Won!";
                document.getElementById("winSound").play();
            } else if (userGuess < secret && guessesRemaining > 0) {
                document.getElementById("feedbackLabel").innerText = "Guess Higher!";
            } else if (userGuess > secret && guessesRemaining > 0) {
                document.getElementById("feedbackLabel").innerText = "Guess Lower!";
            } else if (guessesRemaining === 0) {
    document.getElementById("feedbackLabel").innerText = "Out of guesses. You Lose. Press one of the difficulty levels to play again. The secret number was " + secret + ".";
    document.getElementById("loseSound").play();
}
        }
    </script>

</body>
</html>
